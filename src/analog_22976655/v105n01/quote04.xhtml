      <p><span itemscope itemtype="http://schema.org/Person"><span itemprop="name">Arthur C. Clarke</span><link itemprop="sameAs" href="http://viaf.org/viaf/27062571"/></span> once said that any technology sufficiently advanced to a more primitive culture would be indistinguishable from magic. However, there’s always the remote possibility that the technology <i>is</i> magic.</i></p>
